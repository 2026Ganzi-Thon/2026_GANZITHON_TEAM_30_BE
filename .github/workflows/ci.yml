name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          AI_PROVIDER: local
          EMAIL_MODE: demo
      - run: pip-audit -r requirements.txt
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact -v

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ondo
          POSTGRES_PASSWORD: ondo-ci
          POSTGRES_DB: ondo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ondo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          DATABASE_URL: postgresql://ondo:ondo-ci@localhost:5432/ondo_test
          AI_PROVIDER: local
          EMAIL_MODE: demo
      - name: deploy seed on postgres
        run: |
          python -c "import deploy_start; deploy_start.seed_if_empty()"
          python demo_seed.py --job 개발 --reset
          python demo_seed_b.py
        env:
          DATABASE_URL: postgresql://ondo:ondo-ci@localhost:5432/ondo_test
          AI_PROVIDER: local
          PYTHONIOENCODING: utf-8
